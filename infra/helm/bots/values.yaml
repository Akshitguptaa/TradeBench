replicaCount: 1

image:
  repository: tradebench/bots
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8083

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env: {}

autoscaling:
  minReplicas: 1
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
