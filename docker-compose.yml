networks:
  tradebench: null
  sandbox-net:
    internal: true
volumes:
  redpanda-data: null
  timescale-data: null
  redis-data: null
  minio-data: null
services:
  redpanda:
    image: redpandadata/redpanda:v23.3.5
    command:
    - redpanda start
    - --smp 1
    - --memory 512M
    - --overprovisioned
    - --kafka-addr PLAINTEXT://0.0.0.0:9092
    - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
    - 9092:9092
    - 9644:9644
    volumes:
    - redpanda-data:/var/lib/redpanda/data
    networks:
    - tradebench
    healthcheck:
      test:
      - CMD
      - rpk
      - cluster
      - health
      interval: 5s
      retries: 10
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: tradebench
      POSTGRES_USER: tradebench
      POSTGRES_PASSWORD: tradebench
    ports:
    - 5432:5432
    volumes:
    - timescale-data:/var/lib/postgresql/data
    - ./infra/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
    - tradebench
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U tradebench
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    networks:
    - tradebench
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tradebench
      MINIO_ROOT_PASSWORD: tradebench123
    ports:
    - 9005:9000
    - 9006:9001
    volumes:
    - minio-data:/data
    networks:
    - tradebench
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 5s
      retries: 10
  redpanda-init:
    image: redpandadata/redpanda:v23.3.5
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
    - tradebench
    entrypoint: "bash -c \"\n  rpk topic create submission.queued run.started telemetry.raw\
      \ run.completed score.updated --brokers redpanda:9092 --partitions 6 --replicas\
      \ 1 || true\n\"\n"
  gateway:
    build:
      context: apps/gateway
      dockerfile: Dockerfile
    ports:
    - 8080:8080
    environment:
      JWT_SECRET: dev-secret-change-me
      SUBMISSION_URL: http://submission:8081
      LEADERBOARD_URL: http://leaderboard:8085
      INGESTER_URL: http://ingester:8084
      SCORER_URL: http://scorer:8086
      BOTS_URL: http://bots:8083
      SANDBOX_URL: http://sandbox:8082
    depends_on:
      submission:
        condition: service_started
      leaderboard:
        condition: service_started
    networks:
    - tradebench
  submission:
    build:
      context: apps/submission
      dockerfile: Dockerfile
    ports:
    - 8081:8081
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
    - tradebench
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: tradebench
      MINIO_SECRET_KEY: tradebench123
      MINIO_BUCKET: tradebench
      KAFKA_BROKERS: redpanda:9092
  sandbox:
    build:
      context: apps/sandbox
      dockerfile: Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: tradebench
      MINIO_SECRET_KEY: tradebench123
      MINIO_BUCKET: tradebench
      SANDBOX_IMAGE: tradebench/sandbox-base:latest
      SANDBOX_NETWORK: tradebench_sandbox-net
      SANDBOX_RUNTIME: runc
      KAFKA_BROKERS: redpanda:9092
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
    - tradebench
    - sandbox-net
  bots:
    build:
      context: apps/bots
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
    networks:
    - tradebench
    - sandbox-net
  dummy-orderbook:
    build:
      context: apps/dummy-orderbook
      dockerfile: Dockerfile
    ports:
    - 8089:8080
    networks:
    - tradebench
  ingester:
    build:
      context: apps/ingester
      dockerfile: Dockerfile
    ports:
    - 8084:8084
    environment:
      KAFKA_BROKERS: redpanda:9092
      TIMESCALE_DSN: postgres://tradebench:tradebench@timescaledb:5432/tradebench?sslmode=disable
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
    - tradebench
  leaderboard:
    build:
      context: apps/leaderboard
      dockerfile: Dockerfile
    ports:
    - 8085:8085
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_ADDR: redis:6379
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
    - tradebench
  scorer:
    build:
      context: apps/scorer
      dockerfile: Dockerfile
    ports:
    - 8086:8086
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
    - tradebench
